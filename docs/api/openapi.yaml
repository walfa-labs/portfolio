      description: A JSON:API resource object. `title`, `awarding_body` and `awarded_at` are required on `POST` and `PUT`.
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/AwardWriteRequest' }

    AwardUpdate:
      required: true
      description: A JSON:API resource object. Every attribute is optional; omitted members are left untouched.
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/AwardUpdateRequest' }

    WritingWrite:
      required: true
      description: A JSON:API resource object. Only `title` is required on `POST` and `PUT`. `body_html` and `reading_time_minutes` are derived and are a `422` if supplied.
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/WritingWriteRequest' }

    WritingUpdate:
      required: true
      description: A JSON:API resource object. Every attribute is optional; omitted members are left untouched.
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/WritingUpdateRequest' }

    TagWrite:
      required: true
      description: A JSON:API resource object. `name` is required on `POST` and `PUT`. Content-only members such as `title` and `status` are a `422` here.
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/TagWriteRequest' }

    TagUpdate:
      required: true
      description: A JSON:API resource object. Every attribute is optional; omitted members are left untouched.
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/TagUpdateRequest' }

  schemas:

    # ------------------------------------------------------------------ errors

    JsonApiErrorDocument:
      type: object
      description: The one error document. `data` never appears alongside `errors`.
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/JsonApiError' }

    JsonApiError:
      type: object
      description: |
        One error object. `meta.request_id` is always present — it echoes an inbound `X-Request-Id`
        when the caller or the edge supplied one, so the API's id lines up with theirs, and is
        stable across every error object in one response.
      required: [status, code, title, meta]
      properties:
        status:
          type: string
          pattern: '^[0-9]{3}$'
        code:
          type: string
          description: A stable machine string. Clients branch on this, never on `title` or `detail`.
          enum:
            - invalid_query_parameter
            - malformed_body
            - unauthenticated
            - forbidden
            - not_found
            - method_not_allowed
            - not_acceptable
            - conflict
            - unsupported_media_type
            - validation_failed
            - rate_limited
            - server_error
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        detail:
          type: string
          description: A human-readable explanation of this occurrence.
        source: { $ref: '#/components/schemas/JsonApiErrorSource' }
        links:
          type: object
          description: JSON:API `links.about` / `links.type`, when a problem type has a page.
          additionalProperties:
            type: string
            format: uri
        meta: { $ref: '#/components/schemas/JsonApiErrorMeta' }

    JsonApiErrorSource:
      type: object
      description: Where the error came from. At most one member is present.
      properties:
        pointer:
          type: string
          description: 'An RFC 6901 JSON Pointer into the request document, for example `/data/attributes/title` or `/data/relationships/tags/data/0/id`.'
        parameter:
          type: string
          description: 'The query parameter, in its query-string spelling, for example `filter[foo]` or `page[size]`.'
        header:
          type: string
          description: 'The request header the caller must fix, for example `Content-Type` or `Accept`.'

    JsonApiErrorMeta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
          description: Quote this when reporting a `500`.

    # -------------------------------------------------------------- pagination

    PaginationPage:
      type: object
      description: The collection document's `meta.page`.
      required: [number, size, total, pages]
      properties:
        number:
          type: integer
          minimum: 1
        size:
          type: integer
          description: The page size that was applied, between 1 and 100.
        total:
          type: integer
          minimum: 0
          description: Total records matching the filters, not the records on this page.
        pages:
          type: integer
          minimum: 0

    CollectionLinks:
      type: object
      description: |
        The collection document's `links`. Every member preserves the caller's own query
        parameters, as JSON:API requires.
      required: [self, first, prev, next, last]
      properties:
        self:
          type: string
          format: uri
        first:
          type: string
          format: uri
        prev:
          type: [string, 'null']
          format: uri
          description: '`null` on the first page.'
        next:
          type: [string, 'null']
          format: uri
          description: '`null` on the last page.'
        last:
          type: string
          format: uri

    ResourceLinks:
      type: object
      description: A resource object's or single-resource document's `self` link. The URL a `POST` returns in `Location` is built from the same named route, because JSON:API requires the two to match.
      required: [self]
      properties:
        self:
          type: string
          format: uri

    CollectionMeta:
      type: object
      required: [page]
      properties:
        page: { $ref: '#/components/schemas/PaginationPage' }

    SingleMeta:
      type: object
      required: [updated_at]
      properties:
        updated_at:
          type: [string, 'null']
          format: date-time
          description: The record's `updated_at` — the same value the `Last-Modified` header carries.

    # ------------------------------------------------------------ relationships

    TagIdentifier:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          const: tags
        id:
          type: string
          description: The tag's numeric id, as a string. Every id this API emits is a string.

    Relationships:
      type: object
      description: |
        A resource object's `relationships`. `tags` is the only relationship in v1, and its object
        carries `data` — the resource linkage — and **nothing else**. JSON:API 1.1 requires a server
        to answer `GET` on any relationship URL it advertises as a `links.self`, and v1 serves no
        relationship endpoints (the resource set is closed at eight), so no relationship `links`
        member is emitted at all. `links` is optional in a relationship object, so omitting it is
        valid where advertising a dead `self` link is not. Reads use `include=tags` and writes set
        `relationships.tags.data`; the resource object's own `links.self` does resolve and is
        unaffected.
      properties:
        tags:
          type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TagIdentifier' }

    RelationshipsWrite:
      type: object
      description: |
        The `relationships` member of a write document. Omitted entirely, it clears the associations
        on a `PUT` and leaves them untouched on a `PATCH`; `data: []` always clears them. Tags are
        never created implicitly, and an unknown tag id is a `422` pointing at
        `/data/relationships/tags/data/<index>/id`.
      properties:
        tags:
          type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TagIdentifier' }

    IncludedTags:
      type: array
      description: The embedded resource objects for `include=tags`. Present only when the caller asked for it, and never carrying the same resource twice.
      items: { $ref: '#/components/schemas/TagResource' }

    # ---------------------------------------------------------------- attributes

    ContentAttributes:
      type: object
      description: |
        The attributes every content resource publishes. The writable SEO and admin columns
        (`status`, `meta_title`, `meta_description`, `sort_order`) are deliberately not published,
        so they are not selectable through a sparse fieldset either. Nothing here is marked
        required because a sparse fieldset may legitimately select any subset.
      properties:
        title:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 191
          readOnly: true
          description: Derived server-side from `title` on create and stable on update. Never client-supplied.
        summary:
          type: [string, 'null']
        body:
          type: [string, 'null']
          description: Markdown for `writings`, plain text otherwise.
        published_at:
          type: [string, 'null']
          format: date-time
          description: '`null` while the record is a draft; a future value schedules publication.'
        is_published:
          type: boolean
          description: Always `true` on this API — every public read is `published()`-scoped, and drafts are never reachable.
        is_placeholder:
          type: boolean
          description: True for the seeded placeholder content.
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    SharedWritableAttributes:
      type: object
      description: |
        The writable attributes every content resource shares. `id`, `slug`, `created_at`,
        `updated_at` and `deleted_at` are **never** writable — supplying one is a `422` with that key
        in `source.pointer`. Any attribute absent from this object and from the resource's own extra
        set is a `422` too.
      properties:
        title:
          type: string
          maxLength: 150
          description: Required on `POST` and on `PUT`. NOT NULL with no database default, so a `PUT` that omits it is a `422`, not a silent reset.
        summary:
          type: [string, 'null']
        body:
          type: [string, 'null']
        status:
          type: string
          enum: [draft, published]
          default: draft
          description: A `PUT` that omits it resets it to `draft`.
        published_at:
          type: [string, 'null']
          format: date-time
        meta_title:
          type: [string, 'null']
          maxLength: 60
        meta_description:
          type: [string, 'null']
          maxLength: 160
        sort_order:
          type: integer
          minimum: 0
          default: 0
          description: Admin list order; invisible publicly by design. A `PUT` that omits it resets it to `0`.
        is_placeholder:
          type: boolean
          default: false
          description: A `PUT` that omits it resets it to `false`.

    CoverVariants:
      type: [object, 'null']
      description: |
        Derived, read-only: a map of variant name (`thumb`, `card`, `full`, …) to absolute URL.
        `null` until the media pipeline resolves it — the keys are emitted from v1 day one so the
        document never changes shape.
      additionalProperties:
        type: string
        format: uri

    Screenshots:
      type: array
      readOnly: true
      description: Derived, read-only project screenshots, each carrying its own `alt` so a client can render accessible markup without a second request. Empty until the media pipeline resolves it.
      items:
        type: object
        properties:
          url:
            type: [string, 'null']
            format: uri
          variants: { $ref: '#/components/schemas/CoverVariants' }
          alt:
            type: [string, 'null']
            description: The `alt` text stored on the media row. Never inferred from the file name.

    SeriesAttribute:
      type: [object, 'null']
      readOnly: true
      description: |
        The writing's series, `null` when there is none. It is an **attribute object, not a
        relationship**: `include=series` is a `400` exactly like any other undeclared include, and
        there is no `/api/v1/series` resource because Table A is closed at eight.
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string

    # -------------------------------------------------------- work-experiences

    WorkExperienceAttributes:
      allOf:
        - $ref: '#/components/schemas/ContentAttributes'
        - type: object
          properties:
            employer:
              type: string
              maxLength: 150
            employer_url:
              type: [string, 'null']
              format: uri
              maxLength: 2048
            location:
              type: [string, 'null']
              maxLength: 100
            start_date:
              type: [string, 'null']
              format: date
            end_date:
              type: [string, 'null']
              format: date
              description: '`null` for a current role. The API states the date; rendering "Present" is the client''s decision.'
            highlights:
              type: array
              items:
                type: string
                maxLength: 250
            logo_url:
              type: [string, 'null']
              format: uri
              readOnly: true
            logo_alt:
              type: [string, 'null']
              readOnly: true

    WorkExperienceWritableAttributes:
      allOf:
        - $ref: '#/components/schemas/SharedWritableAttributes'
        - type: object
          properties:
            employer:
              type: string
              maxLength: 150
              description: Required on `POST` and `PUT`.
            employer_url:
              type: [string, 'null']
              format: uri
              maxLength: 2048
            location:
              type: [string, 'null']
              maxLength: 100
            start_date:
              type: string
              format: date
              description: Required on `POST` and `PUT`.
            end_date:
              type: [string, 'null']
              format: date
            highlights:
              type: [array, 'null']
              items:
                type: string
                maxLength: 250

    WorkExperienceResource:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          const: work_experiences
        id:
          type: string
        attributes: { $ref: '#/components/schemas/WorkExperienceAttributes' }
        relationships: { $ref: '#/components/schemas/Relationships' }
        links: { $ref: '#/components/schemas/ResourceLinks' }

    WorkExperienceDocument:
      type: object
      required: [data, links, meta]
      properties:
        data: { $ref: '#/components/schemas/WorkExperienceResource' }
        included: { $ref: '#/components/schemas/IncludedTags' }
        links: { $ref: '#/components/schemas/ResourceLinks' }
        meta: { $ref: '#/components/schemas/SingleMeta' }

    WorkExperienceCollectionDocument:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WorkExperienceResource' }
        included: { $ref: '#/components/schemas/IncludedTags' }
        links: { $ref: '#/components/schemas/CollectionLinks' }
        meta: { $ref: '#/components/schemas/CollectionMeta' }

    WorkExperienceWriteRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type:
              type: string
              const: work_experiences
            id:
              type: string
              description: '`PUT` only: must equal the id in the path, else `409`. Not accepted on `POST`.'
            attributes:
              allOf:
                - $ref: '#/components/schemas/WorkExperienceWritableAttributes'
                - required: [title, employer, start_date]
            relationships: { $ref: '#/components/schemas/RelationshipsWrite' }

    WorkExperienceUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type]
          properties:
            type:
              type: string
              const: work_experiences
            id:
              type: string
              description: When supplied, must equal the id in the path, else `409`.
            attributes: { $ref: '#/components/schemas/WorkExperienceWritableAttributes' }
            relationships: { $ref: '#/components/schemas/RelationshipsWrite' }

    # ---------------------------------------------------------------- educations

    EducationAttributes:
