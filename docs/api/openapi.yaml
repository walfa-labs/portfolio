jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://localhost
    description: |
      Local development — the FrankenPHP compose stack. `QUERY` is served correctly here;
      `php artisan serve` answers `501 Not Implemented` for it.
  - url: https://portfolio.test
    description: The canonical origin the resource-document examples use.

tags:
  - name: work-experiences
    description: Work history. The public page is `/experience` (singular, canonical); the API resource is `work_experiences`.
  - name: educations
    description: Education history, ordered by `-end_date` by default.
  - name: certifications
    description: Professional certifications, ordered by `-issued_on` by default.
  - name: publications
    description: Publications, ordered by `-issued_on` by default.
  - name: projects
    description: Projects, ordered by `-started_on` by default. The tech stack is the `tags` relationship, not an attribute.
  - name: awards
    description: Awards, ordered by `-awarded_at` by default.
  - name: writings
    description: Blog posts. `body_markdown` is the Markdown source; `body_html` and `reading_time_minutes` are server-side only, and `series` is a read-only attribute object.
  - name: tags
    description: Shared tags. A full six-method resource like every other; it declares no relationships, so it also declares no `include` — `include=tags` on this resource is a `400`.
  - name: search
    description: Site-wide search over published records, served by both `QUERY` and `GET`.

paths:
  /api/v1/work-experiences:
    summary: The `work_experiences` collection
    description: |
      One page of published work experiences. `filter[tag]`, `filter[tags]`, `filter[tags_all]` and
      `filter[q]` are declared; `sort` accepts `end_date` and `title`; the default sort is
      `-end_date`. `include=tags` embeds the tag resource objects.
    get:
      operationId: listWorkExperiences
      summary: List work experiences
      tags: [work-experiences]
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptJsonApi'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/FilterWorkExperiences'
        - $ref: '#/components/parameters/SortWorkExperiences'
        - $ref: '#/components/parameters/IncludeTags'
        - $ref: '#/components/parameters/FieldsWorkExperiences'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/WorkExperienceCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    head:
      operationId: headWorkExperiencesCollection
      summary: Headers of the work experiences collection
      description: The same status and headers as `GET`, with no body. Accepts the same parameters.
      tags: [work-experiences]
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptJsonApi'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/FilterWorkExperiences'
        - $ref: '#/components/parameters/SortWorkExperiences'
        - $ref: '#/components/parameters/IncludeTags'
        - $ref: '#/components/parameters/FieldsWorkExperiences'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/WorkExperienceCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    options:
      operationId: optionsWorkExperiencesCollection
      summary: Discover the verbs the collection answers
      description: |
        `200` with `Allow: GET, HEAD, OPTIONS, POST` and an empty body. Public, unthrottled, no
        `X-RateLimit-*` headers. `QUERY` on a collection is a `405`.
      tags: [work-experiences]
      security: []
      responses:
        '200': { $ref: '#/components/responses/CollectionOptions' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    post:
      operationId: createWorkExperience
      summary: Create a work experience
      description: |
        `201` with the new representation and its `Location`. Requires a session and the
        administrator. `title`, `employer` and `start_date` are required. The slug is derived from
        `title`; supplying `slug` is a `422`.
      tags: [work-experiences]
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/AcceptJsonApi'
        - $ref: '#/components/parameters/ContentTypeJsonApi'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody: { $ref: '#/components/requestBodies/WorkExperienceWrite' }
      responses:
        '201': { $ref: '#/components/responses/WorkExperienceCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/work-experiences/{work_experience}:
    summary: One `work_experiences` record
    description: |
      A single published work experience, bound by its numeric `id`. `include=tags` and
      `fields[work-experiences]` are declared; `filter`, `sort` and `page` are not, and answer
      `400`.
    parameters:
      - $ref: '#/components/parameters/WorkExperienceId'
    get:
      operationId: showWorkExperience
      summary: Fetch a work experience
      tags: [work-experiences]
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptJsonApi'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/IncludeTags'
        - $ref: '#/components/parameters/FieldsWorkExperiences'
      responses:
        '200': { $ref: '#/components/responses/WorkExperienceItem' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    head:
      operationId: headWorkExperience
      summary: Headers of one work experience
      description: The same status and headers as `GET`, with no body. Accepts the same parameters.
      tags: [work-experiences]
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptJsonApi'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/IncludeTags'
        - $ref: '#/components/parameters/FieldsWorkExperiences'
      responses:
        '200': { $ref: '#/components/responses/WorkExperienceItem' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    options:
      operationId: optionsWorkExperience
      summary: Discover the verbs a single work experience answers
