              maxLength: 255
            doi:
              type: [string, 'null']
              maxLength: 100
              pattern: '^10\.\d{4,9}/\S+$'
            issued_on:
              type: string
              format: date
              description: Required on `POST` and `PUT`.

    PublicationResource:
