  /api/v1/search:
    summary: Site-wide search
    description: |
      One endpoint, two entry points, one document.

      * `QUERY` carries the query in an `application/json` body — the only request that outgrows a
        URI is site-wide search, and `QUERY` is safe and idempotent, so it stays cacheable.
      * `GET` flattens the same fields into query parameters for clients that cannot send `QUERY`,
        and returns the **identical** document — there is no method marker in the payload.

      There is **no `POST` fallback**: an unsafe verb would teach clients the wrong thing about a
      safe query. The success document is plain `application/json` (its primary data mixes resource
      types); every error is a JSON:API document under `application/vnd.api+json`. Responses are
      `private, max-age=0, must-revalidate` with a strong `ETag`. `private` is a policy choice that
      keeps shared caches from storing the response at all — it is **not** the mechanism that
      satisfies RFC 10008's requirement that a cache key incorporate the request content. The
      validator is made request-specific instead: a `QUERY`'s `ETag` hashes the serialised document
      together with the request body, so a private cache cannot reuse one query's document for
      another's.

      Only published records are ever reachable, and no parameter widens that scope.
    get:
      operationId: search
      summary: Search with the flattened query-string form
      description: |
        The same fields as the `QUERY` body, flattened. Shape violations that only a body can
        express — a `q` of the wrong type, a `page` that is not an object — cannot occur here, so
        Table B gives this entry point no `422`: every shape violation is a `400`. A `q` shorter
        than two characters finds nothing rather than failing, mirroring the public page.

        The response carries `Accept-Query: application/json` so a client can discover that the
        same URI also answers `QUERY`.
      tags: [search]
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptSearch'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/SearchQ'
        - $ref: '#/components/parameters/SearchTypes'
        - $ref: '#/components/parameters/SearchTags'
        - $ref: '#/components/parameters/SearchSort'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/SearchOk' }
        '304': { $ref: '#/components/responses/SearchNotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '406': { $ref: '#/components/responses/SearchNotAcceptable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    head:
      operationId: headSearch
      summary: Headers of the search endpoint
      description: |
        The same status and headers as `GET /api/v1/search`, with no body — including
        `Accept-Query: application/json`.
      tags: [search]
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptSearch'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/SearchQ'
        - $ref: '#/components/parameters/SearchTypes'
        - $ref: '#/components/parameters/SearchTags'
        - $ref: '#/components/parameters/SearchSort'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/SearchOk' }
        '304': { $ref: '#/components/responses/SearchNotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '406': { $ref: '#/components/responses/SearchNotAcceptable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    options:
      operationId: optionsSearch
      summary: Discover that the search endpoint answers QUERY
      description: |
        `200`, empty body, with `Allow: GET, HEAD, OPTIONS, QUERY` and
        `Accept-Query: application/json`. This is how a client learns the URI takes a `QUERY` and
        what media type its body must declare. Public and unthrottled.
      tags: [search]
      security: []
      responses:
        '200': { $ref: '#/components/responses/SearchOptions' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    query:
      operationId: querySearch
      summary: Search with a QUERY body
      description: |
        `QUERY /api/v1/search` — RFC 10008. Safe and idempotent. The request body is
        `application/json` and is the query itself. A `Content-Type` that is present but names
        anything else is a `415` whose response advertises `Accept: application/json` and
        `Accept-Query: application/json`; a **missing** `Content-Type` is a `400` — §4.1's table
        separates the two, and its `400` rule is scoped to this endpoint (pinned decision 13).

        Error split by source: a `400` names the offending **query parameter** in
        `source.parameter` (spelled identically for both entry points, so `page[size]`, not
        `/page/size`), while a `422` — which only a body can provoke — names a **pointer** into the
        request document in `source.pointer`. An undeclared member of the body is a `400`; a `q`
        outside 2–100 characters, a `types` that is not an array, or a `page` that is not an object
        is a `422`. An unknown `types` value or an unknown `sort` field is a `400`.

        The response is `application/json`, not JSON:API, and therefore carries no `Vary: Accept`.
        `Content-Location`/`Location` are absent because v1 mints no result URIs.
      tags: [search]
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptSearch'
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        description: The query document. An empty JSON object is a valid, empty query.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchQuery' }
            examples:
              full:
                summary: The §4.1 worked example
                value:
                  q: vue
                  types: [writings, projects]
                  tags: [laravel]
                  sort: '-published_at'
                  page: { number: 1, size: 20 }
              empty:
                summary: An empty query — the discovery probe
                value: {}
      responses:
        '200': { $ref: '#/components/responses/SearchOk' }
        '304': { $ref: '#/components/responses/SearchNotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '406': { $ref: '#/components/responses/SearchNotAcceptable' }
        '415': { $ref: '#/components/responses/SearchUnsupportedMediaType' }
        '422': { $ref: '#/components/responses/SearchValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

components:

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: portfolio-session
      description: |
        Laravel's session cookie — `config('session.cookie')`, which is
        `Str::slug(APP_NAME).'-session'`, so the literal cookie name depends on `APP_NAME`.
        Fortify authenticates the `web` guard from it. The only writer is one human driving the
        Inertia admin UI on the same origin as the API, so writes additionally need the
        `X-XSRF-TOKEN` header carrying the `XSRF-TOKEN` cookie's value: the write routes sit in the
        `api-admin` group, which is cookies + session + CSRF + `auth` + `verified` + the write
        throttle, in that order. Reads are public and need no credentials.

        A missing session is a `401`, never a `419`: the CSRF middleware is ordered after `auth`.
        There is no token scheme in v1 — `laravel/sanctum` is not installed, and adding it with
        per-resource token abilities is documented as future work.

  parameters:

    AcceptJsonApi:
      name: Accept
      in: header
      required: false
      description: |
        `application/vnd.api+json` (preferred) or `application/json` — both select the same
        document. An `Accept` naming neither, such as `text/html` or `application/xml`, is a `406`
        whose response carries `Accept: application/vnd.api+json`.
      schema:
        type: string
        default: application/vnd.api+json
      examples:
        jsonApi:
          value: application/vnd.api+json
        plainJson:
          value: application/json

    AcceptSearch:
      name: Accept
      in: header
      required: false
      description: |
        `application/json` is what the success document is served as; `application/vnd.api+json` is
        also accepted because that is what the endpoint's *errors* are served as. Anything else is a
        `406` whose response carries `Accept: application/json, application/vnd.api+json`.
      schema:
        type: string
        default: application/json
      examples:
        json:
          value: application/json
        jsonApi:
          value: application/vnd.api+json

    ContentTypeJsonApi:
      name: Content-Type
      in: header
      required: true
      description: |
        Must be `application/vnd.api+json`. A parameter is accepted only when it is one JSON:API
        defines for its media type (`ext`, `profile`); anything else, and a missing header, is a
        `415` with `source.header: Content-Type` and `Accept: application/vnd.api+json` on the
        response.
      schema:
        type: string
        default: application/vnd.api+json
      example: application/vnd.api+json

    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: |
        The URL-decoded value of the `XSRF-TOKEN` cookie, which the same-origin Inertia client
        reads and echoes automatically. Required on every write; the `api-admin` group runs
        `PreventRequestForgery` after `auth`, so an unauthenticated write is a `401` rather than a
        CSRF failure.
      schema:
        type: string

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        The `ETag` of a representation the client already holds. A match answers `304` with the same
        validators and no body. `ETag` is the authoritative validator: it hashes the serialised
        representation **plus the caller's query parameters**, so two pages of one collection are
        two representations.
      schema:
        type: string
      example: '"writings:collection:d41d8cd9"'

    IfModifiedSince:
      name: If-Modified-Since
      in: header
      required: false
      description: |
        Honoured alongside `If-None-Match`. `Last-Modified` has one-second granularity, so `ETag`
        wins where the two disagree.
      schema:
        type: string
        format: http-date
      example: 'Mon, 05 Oct 2026 11:20:00 GMT'

    WorkExperienceId:
      name: work_experience
      in: path
      required: true
      description: |
        The numeric `id`. §4.2 writes this parameter as `{id}`; the route parameter Laravel derives
        from `apiResource('work-experiences', …)` is `work_experience`, which is what this document
        uses so it matches `php artisan route:list --json` character for character. Slugs are
        attributes, never API path parameters.
      schema:
        type: integer
        minimum: 1

    EducationId:
      name: education
      in: path
      required: true
      description: The numeric `id`. §4.2 writes this parameter as `{id}`.
      schema:
        type: integer
        minimum: 1

    CertificationId:
      name: certification
      in: path
      required: true
      description: The numeric `id`. §4.2 writes this parameter as `{id}`.
      schema:
        type: integer
        minimum: 1

    PublicationId:
      name: publication
      in: path
      required: true
      description: The numeric `id`. §4.2 writes this parameter as `{id}`.
      schema:
        type: integer
        minimum: 1

    ProjectId:
      name: project
      in: path
      required: true
      description: The numeric `id`. §4.2 writes this parameter as `{id}`.
      schema:
        type: integer
        minimum: 1

    AwardId:
      name: award
      in: path
      required: true
      description: The numeric `id`. §4.2 writes this parameter as `{id}`.
      schema:
        type: integer
        minimum: 1

    WritingId:
      name: writing
      in: path
      required: true
      description: The numeric `id`. §4.2 writes this parameter as `{id}`.
      schema:
        type: integer
        minimum: 1

    TagId:
      name: tag
      in: path
      required: true
      description: The numeric `id`. §4.2 writes this parameter as `{id}`.
      schema:
        type: integer
        minimum: 1

    FilterWorkExperiences:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: |
        The declared filters. An undeclared name — `filter[foo]` — is a `400` with
        `source.parameter: filter[foo]`, never ignored.
      schema:
        type: object
        additionalProperties: false
        properties:
          tag:
            type: string
            description: 'Tag slugs, comma-separated, meaning **any of**. Example: `filter[tag]=laravel,vue`.'
          tags:
            type: string
            description: An alias of `tag`, accepted because §4.2 and §4.8 both spell the worked example this way.
          tags_all:
            type: string
            description: 'Tag slugs, comma-separated, meaning **all of** — the record must carry every named tag.'
          q:
            type: string
            description: A partial, case-insensitive match over the resource's text columns (`title`, `summary`).

    FilterEducations:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: The declared filters; an undeclared name is a `400`.
      schema:
        type: object
        additionalProperties: false
        properties:
          tag:
            type: string
            description: 'Tag slugs, comma-separated, meaning any of.'
          tags:
            type: string
            description: An alias of `tag`.
          tags_all:
            type: string
            description: 'Tag slugs, comma-separated, meaning all of.'
          q:
            type: string
            description: A partial match over `title` and `summary`.

    FilterCertifications:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: The declared filters; an undeclared name is a `400`.
      schema:
        type: object
        additionalProperties: false
        properties:
          tag:
            type: string
            description: 'Tag slugs, comma-separated, meaning any of.'
          tags:
            type: string
            description: An alias of `tag`.
          tags_all:
            type: string
            description: 'Tag slugs, comma-separated, meaning all of.'
          q:
            type: string
            description: A partial match over `title` and `summary`.
          expired:
            type: boolean
            description: |
              `true` selects records whose `expires_on` is in the past; `false` selects the rest —
              unexpired or never expiring. Any other value is a `400`.

    FilterPublications:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: The declared filters; an undeclared name is a `400`.
      schema:
        type: object
        additionalProperties: false
        properties:
          tag:
            type: string
            description: 'Tag slugs, comma-separated, meaning any of.'
          tags:
            type: string
            description: An alias of `tag`.
          tags_all:
            type: string
            description: 'Tag slugs, comma-separated, meaning all of.'
          q:
            type: string
            description: A partial match over `title` and `summary`.

    FilterProjects:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: The declared filters; an undeclared name is a `400`.
      schema:
        type: object
        additionalProperties: false
        properties:
          tag:
            type: string
            description: 'Tag slugs, comma-separated, meaning any of — the project tech stack.'
          tags:
            type: string
            description: An alias of `tag`.
          tags_all:
            type: string
            description: 'Tag slugs, comma-separated, meaning all of.'
          q:
            type: string
            description: A partial match over `title` and `summary`.
          featured:
            type: boolean
            description: '`true` selects `is_featured` projects. Any other value is a `400`.'

    FilterAwards:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: The declared filters; an undeclared name is a `400`.
      schema:
        type: object
        additionalProperties: false
        properties:
          tag:
            type: string
            description: 'Tag slugs, comma-separated, meaning any of.'
          tags:
            type: string
            description: An alias of `tag`.
          tags_all:
            type: string
            description: 'Tag slugs, comma-separated, meaning all of.'
          q:
            type: string
            description: A partial match over `title` and `summary`.

    FilterWritings:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: The declared filters; an undeclared name is a `400`.
      schema:
        type: object
        additionalProperties: false
        properties:
          tag:
            type: string
            description: 'Tag slugs, comma-separated, meaning any of.'
          tags:
            type: string
            description: An alias of `tag`.
          tags_all:
            type: string
            description: 'Tag slugs, comma-separated, meaning all of.'
          q:
            type: string
            description: A partial match over `title` and `summary`.
          series:
            type: string
            description: |
              Series ids or slugs, comma-separated. A numeric value matches `series_id`; anything
              else matches the series slug.

    FilterTags:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: The declared filters; an undeclared name is a `400`.
      schema:
        type: object
        additionalProperties: false
        properties:
          tag:
            type: string
            description: 'Tag slugs, comma-separated. On this resource the filter matches the tags themselves.'
          tags:
            type: string
            description: An alias of `tag`.
          q:
            type: string
            description: A partial match over `name`.

    SortWorkExperiences:
      name: sort
      in: query
      description: |
        A field, optionally `-` prefixed for descending; comma-separated for a multi-sort
        (`sort=-end_date,title`). Allowed: `end_date`, `title`. An undeclared field is a `400`.
        Default when absent: `-end_date`.
      schema:
        type: string
      x-allowed-sorts: [end_date, '-end_date', title, '-title']
      example: '-end_date'

    SortEducations:
      name: sort
      in: query
      description: |
        Allowed: `end_date`, `title`. An undeclared field is a `400`. Default when absent:
        `-end_date`.
      schema:
        type: string
      x-allowed-sorts: [end_date, '-end_date', title, '-title']
      example: '-end_date'

    SortCertifications:
      name: sort
      in: query
      description: |
        Allowed: `issued_on`, `title`. An undeclared field is a `400`. Default when absent:
        `-issued_on`.
      schema:
        type: string
      x-allowed-sorts: [issued_on, '-issued_on', title, '-title']
      example: '-issued_on'

    SortPublications:
      name: sort
      in: query
      description: |
        Allowed: `issued_on`, `title`. An undeclared field is a `400`. Default when absent:
        `-issued_on`.
      schema:
        type: string
      x-allowed-sorts: [issued_on, '-issued_on', title, '-title']
      example: '-issued_on'

    SortProjects:
      name: sort
      in: query
      description: |
        Allowed: `started_on`, `title`. An undeclared field is a `400`. Default when absent:
        `-started_on`.
      schema:
        type: string
      x-allowed-sorts: [started_on, '-started_on', title, '-title']
      example: '-started_on'

    SortAwards:
      name: sort
      in: query
      description: |
        Allowed: `awarded_at`, `title`. An undeclared field is a `400`. Default when absent:
        `-awarded_at`.
      schema:
        type: string
      x-allowed-sorts: [awarded_at, '-awarded_at', title, '-title']
      example: '-awarded_at'

    SortWritings:
      name: sort
      in: query
      description: |
        Allowed: `published_at`, `title`, `updated_at`. An undeclared field is a `400`. Default when
        absent: `-published_at`. `sort=-updated_at` is the "recently edited" view.
      schema:
        type: string
      x-allowed-sorts: [published_at, '-published_at', title, '-title', updated_at, '-updated_at']
      example: '-published_at'

    SortTags:
      name: sort
      in: query
      description: |
        Allowed: `name`. An undeclared field is a `400`. Default when absent: `name` (ascending —
        a tag cloud is alphabetical).
      schema:
        type: string
      x-allowed-sorts: [name, '-name']
      example: name

    IncludeTags:
      name: include
      in: query
      description: |
        `tags` is the only embeddable relationship in v1, declared on the seven content resources.
        The embedded resource objects land in the document's top-level `included` array. Any other
        value — including `series`, which is an attribute object on `writings`, not a relationship —
        is a `400`. The allow-list is enforced on the collection and single-resource paths alike.

        On `tags` itself the member is **not** declared: a tag declares no relationships — tags are
        shared through the polymorphic pivot, so there is nothing for a tag to embed — and an
        undeclared include is a `400` with `source.parameter: include`, never a silently empty
        `included`.
      schema:
        type: string
        enum: [tags]
      example: tags

    FieldsWorkExperiences:
      name: 'fields[work-experiences]'
      in: query
      style: form
      explode: false
      description: |
        The sparse fieldset. `id` and `type` are always present. An unknown field name, or a
        `fields[…]` key naming a type other than this endpoint's, is a `400` with
        `source.parameter`.
      schema:
        type: array
        items:
          type: string
          enum:
            [title, slug, summary, body, published_at, is_published, is_placeholder, created_at, updated_at, tags,
             employer, employer_url, location, start_date, end_date, highlights, logo_url, logo_alt]
      example: [title, slug, published_at, tags]

    FieldsEducations:
      name: 'fields[educations]'
      in: query
      style: form
      explode: false
      description: The sparse fieldset; an unknown field name is a `400`.
      schema:
        type: array
        items:
          type: string
          enum:
            [title, slug, summary, body, published_at, is_published, is_placeholder, created_at, updated_at, tags,
             institution, institution_url, field_of_study, start_date, end_date, logo_url, logo_alt]
      example: [title, slug, institution]

    FieldsCertifications:
      name: 'fields[certifications]'
      in: query
      style: form
      explode: false
      description: The sparse fieldset; an unknown field name is a `400`.
      schema:
        type: array
        items:
          type: string
          enum:
            [title, slug, summary, body, published_at, is_published, is_placeholder, created_at, updated_at, tags,
             issuer, credential_id, credential_url, issued_on, expires_on, badge_url, badge_alt]
      example: [title, slug, issuer, expires_on]

    FieldsPublications:
      name: 'fields[publications]'
      in: query
      style: form
      explode: false
      description: The sparse fieldset; an unknown field name is a `400`.
      schema:
        type: array
        items:
          type: string
          enum:
            [title, slug, summary, body, published_at, is_published, is_placeholder, created_at, updated_at, tags,
             venue, authors, doi, doi_url, issued_on, pdf_url]
      example: [title, slug, venue, issued_on]

    FieldsProjects:
      name: 'fields[projects]'
      in: query
      style: form
      explode: false
      description: The sparse fieldset; an unknown field name is a `400`.
      schema:
        type: array
        items:
          type: string
          enum:
            [title, slug, summary, body, published_at, is_published, is_placeholder, created_at, updated_at, tags,
             repo_url, live_url, started_on, ended_on, is_featured, cover_url, cover_variants, cover_alt, screenshots]
      example: [title, slug, repo_url, tags]

    FieldsAwards:
      name: 'fields[awards]'
      in: query
      style: form
      explode: false
      description: The sparse fieldset; an unknown field name is a `400`.
      schema:
        type: array
        items:
          type: string
          enum:
            [title, slug, summary, body, published_at, is_published, is_placeholder, created_at, updated_at, tags,
             awarding_body, awarded_at]
      example: [title, slug, awarding_body, awarded_at]

    FieldsWritings:
      name: 'fields[writings]'
      in: query
      style: form
      explode: false
      description: The sparse fieldset; an unknown field name is a `400`.
      schema:
        type: array
        items:
          type: string
          enum:
            [title, slug, summary, excerpt, body_markdown, reading_time_minutes, series, published_at, is_published,
             is_placeholder, created_at, updated_at, cover_url, cover_variants, cover_alt, og_image_path, tags]
      example: [title, slug, published_at, tags]

    FieldsTags:
      name: 'fields[tags]'
      in: query
      style: form
      explode: false
      description: The sparse fieldset; an unknown field name is a `400`.
      schema:
        type: array
        items:
          type: string
          enum: [name, slug, description, is_placeholder, created_at, updated_at]
      example: [name, slug]

    PageNumber:
      name: 'page[number]'
      in: query
      description: |
        1-based. Defaults to `1`. An out-of-range number is a `200` with `data: []`, never a `404`.
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: 'page[size]'
      in: query
      description: |
        Defaults to `20`. Accepted in the range 1–100; anything outside it is a `400`, **never
        silently clamped**. (The PRD's §4.7 code sample clamps; the prose is the rule and the sample
        is the bug.)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SearchQ:
      name: q
      in: query
      description: |
        The search needle. A value shorter than two characters finds nothing rather than failing;
        one longer than 100 characters is truncated. Both rules mirror the public search page, and
        neither is an error on this entry point.
      schema:
        type: string
      example: vue

    SearchTypes:
      name: types
      in: query
      style: form
      explode: false
      description: |
        Comma-separated resource types to search. Both the API's plural-kebab segment and the
        canonical singular are accepted; anything else is a `400`. Omitted means every type.
        (This endpoint takes the plural `types`; the public Inertia page's `type` is singular and
        deliberately different.)
      schema:
        type: array
        items:
          type: string
          enum:
            [work-experiences, work_experience, educations, education, certifications, certification,
             publications, publication, projects, project, awards, award, writings, writing]
      example: [writings, projects]

    SearchTags:
      name: tags
      in: query
      style: form
      explode: false
      description: Comma-separated tag slugs; a hit must carry at least one of them.
      schema:
        type: array
        items:
          type: string
      example: [laravel]

    SearchSort:
      name: sort
      in: query
      description: |
        Allowed: `published_at`, `title`, `updated_at`, each optionally `-` prefixed. Anything else
        is a `400`. Omitted keeps the relevance order.
      schema:
        type: string
      x-allowed-sorts:
        [published_at, '-published_at', title, '-title', updated_at, '-updated_at']
      example: '-published_at'

  headers:

    Allow:
      description: |
        The verbs this URI shape answers. Per shape, never one value for the whole API:
        a collection is `GET, HEAD, OPTIONS, POST`, a single resource
        `GET, HEAD, OPTIONS, PUT, PATCH, DELETE`, and `/api/v1/search`
        `GET, HEAD, OPTIONS, QUERY`. Carried on `OPTIONS` and on every `405`.
      schema:
        type: string
      examples:
        collection:
          value: 'GET, HEAD, OPTIONS, POST'
        item:
          value: 'GET, HEAD, OPTIONS, PUT, PATCH, DELETE'
        search:
          value: 'GET, HEAD, OPTIONS, QUERY'

    AcceptQuery:
      description: |
        A registered Structured Field of type `List`, naming the media type a `QUERY` request body
        must declare. Present on `GET`, `HEAD` and `OPTIONS` of `/api/v1/search` — it is how a
        client discovers QUERY support — and on the `415` that a `QUERY` with the wrong body media
        type produces. Absent from a `QUERY` response: the request already proved support.
      schema:
        type: string
      example: application/json

    Accept:
      description: |
        What this endpoint can produce, sent on a `406` or a `415` so the caller learns what to
        send next. A resource endpoint advertises `application/vnd.api+json`; `/api/v1/search`
        advertises `application/json, application/vnd.api+json`.
      schema:
        type: string
      examples:
        jsonApi:
          value: application/vnd.api+json
        search:
          value: 'application/json, application/vnd.api+json'

    CacheControl:
      description: |
        `public, max-age=60, stale-while-revalidate=30` on a public collection or single-resource
        read; `private, max-age=0, must-revalidate` on search; `no-store` on every write and every
        error.
      schema:
        type: string
      examples:
        publicRead:
          value: public, max-age=60, stale-while-revalidate=30
        search:
          value: private, max-age=0, must-revalidate
        noStore:
          value: no-store

    ETag:
      description: |
        A strong validator. On a resource read it hashes the serialised representation **plus the
        caller's query parameters**, so two pages of one collection are two representations; on
        search it hashes the serialised document, which is a function of every parameter. Pair it
        with `If-None-Match` to get a `304`.
      schema:
        type: string
      example: '"writings:collection:d41d8cd9"'

    LastModified:
      description: |
        The newest `updated_at` in the payload, as an HTTP-date. One-second granularity, so `ETag`
        is the authoritative validator; both are emitted when derivable.
      schema:
        type: string
        format: http-date
      example: 'Mon, 05 Oct 2026 11:20:00 GMT'

    Location:
      description: |
        The URL of the resource just created. Built from the same named route as the resource
        object's own `links.self`, because JSON:API requires the two to match.
      schema:
        type: string
        format: uri
      example: https://portfolio.test/api/v1/writings/42

    RetryAfter:
      description: How many seconds to wait before retrying. Present on `429` only.
      schema:
        type: integer
      example: 30

    Vary:
      description: '`Accept` on every JSON:API response. Absent from the search success document, which is `application/json` by contract.'
      schema:
        type: string
      example: Accept

    XRateLimitLimit:
      description: The request ceiling of the limiter that applied, per minute.
      schema:
        type: integer
      examples:
        publicRead:
          value: 120
        search:
          value: 30
        adminWrite:
          value: 60

    XRateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
      example: 119

    XRateLimitReset:
      description: Unix timestamp at which the current window resets.
      schema:
        type: integer
      example: 1791181200

  responses:

    NoContent:
      description: |
        The record is soft-deleted and there is no body. A second `DELETE` of the same id is a `404`,
        so the effect of the verb stays idempotent.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }

    NotModified:
      description: |
        The caller's `If-None-Match` or `If-Modified-Since` matches the current representation. No
        body; the same validators are repeated.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        ETag: { $ref: '#/components/headers/ETag' }
        Last-Modified: { $ref: '#/components/headers/LastModified' }
        Vary: { $ref: '#/components/headers/Vary' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }

    SearchNotModified:
      description: The caller's `If-None-Match` matches the current search document. No body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        ETag: { $ref: '#/components/headers/ETag' }
        Accept-Query: { $ref: '#/components/headers/AcceptQuery' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }

    BadRequest:
      description: |
        An unrecognised or undeclared `filter[…]`, `sort`, `include` or `fields[…]`, an unknown
        top-level query parameter, a `page[size]` outside 1–100, an operator filter carrying a
        comma-separated list, a boolean filter with a value that is not `1`, `0`, `true` or
        `false`, or a body that is not parseable JSON. Never ignored — always rejected, with the
        offending parameter or pointer named.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            invalidQueryParameter:
              summary: An undeclared filter — the §4.6 example
              value:
                errors:
                  - status: '400'
                    code: invalid_query_parameter
                    title: Invalid query parameter
                    detail: 'Unknown filter "foo". Allowed filters for writings: title, slug, published_at, tags, tags_all.'
                    source:
                      parameter: 'filter[foo]'
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2
            malformedBody:
              summary: A body that is not a JSON object
              value:
                errors:
                  - status: '400'
                    code: malformed_body
                    title: Invalid query parameter
                    detail: The request body must be a JSON object.
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2
            pageSizeOutOfRange:
              summary: page[size] outside 1–100 — rejected, never clamped
              value:
                errors:
                  - status: '400'
                    code: invalid_query_parameter
                    title: Invalid query parameter
                    detail: page.size must be between 1 and 100; 1000 given.
                    source:
                      parameter: 'page[size]'
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    Unauthorized:
      description: No session. The write routes run `auth` before the CSRF middleware, so a guest gets a real `401` and not a `419`.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            unauthenticated:
              value:
                errors:
                  - status: '401'
                    code: unauthenticated
                    title: Unauthenticated
                    detail: This endpoint requires an authenticated admin session.
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    Forbidden:
      description: An authenticated session that is not the administrator, or a policy denial. A denial is never hidden as a `404`.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            forbidden:
              value:
                errors:
                  - status: '403'
                    code: forbidden
                    title: Forbidden
                    detail: This action is unauthorized.
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    NotFound:
      description: An unknown id, an unknown collection, or a second `DELETE` of an already-deleted id. Drafts and trashed rows are not reachable at all, so they answer `404` too.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            notFound:
              value:
                errors:
                  - status: '404'
                    code: not_found
                    title: Not found
                    detail: No writings resource with id 999.
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    MethodNotAllowed:
      description: |
        A verb the URI shape does not answer — `QUERY` on a collection, `DELETE` on a collection,
        `POST` on a single resource. The `Allow` header lists the verbs that do work, and `detail`
        repeats them. **The PRD omits this body; it is authored here.**

        This response is referenced from each URI's `OPTIONS` operation, which is the operation that
        advertises the URI's verb set: OpenAPI 3.1 has no way to express "any other verb", so no
        single operation can own it. The body is the same wherever it appears.
      headers:
        Allow: { $ref: '#/components/headers/Allow' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            collection:
              summary: QUERY on a collection — the §15.7 case
              value:
                errors:
                  - status: '405'
                    code: method_not_allowed
                    title: Method not allowed
                    detail: 'The QUERY method is not supported for /api/v1/writings. Allowed methods: GET, HEAD, OPTIONS, POST.'
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2
            item:
              summary: POST on a single resource
              value:
                errors:
                  - status: '405'
                    code: method_not_allowed
                    title: Method not allowed
                    detail: 'The POST method is not supported for /api/v1/writings/42. Allowed methods: GET, HEAD, OPTIONS, PUT, PATCH, DELETE.'
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    NotAcceptable:
      description: |
        The `Accept` header names neither `application/vnd.api+json` nor `application/json`, so no
        representation can be served. The response's own `Accept` names what the endpoint produces.
        **The PRD omits this body; it is authored here.**
      headers:
        Accept: { $ref: '#/components/headers/Accept' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            notAcceptable:
              value:
                errors:
                  - status: '406'
                    code: not_acceptable
                    title: Not acceptable
                    detail: 'No acceptable media type. Acceptable media types: application/vnd.api+json.'
                    source:
                      header: Accept
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    SearchNotAcceptable:
      description: |
        The `Accept` header names neither of the two media types `/api/v1/search` can serve. Its
        `Accept` lists both, so the caller can retry with either.
      headers:
        Accept: { $ref: '#/components/headers/Accept' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            notAcceptable:
              value:
                errors:
                  - status: '406'
                    code: not_acceptable
                    title: Not acceptable
                    detail: 'No acceptable media type. Acceptable media types: application/json, application/vnd.api+json.'
                    source:
                      header: Accept
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    Conflict:
      description: |
        A `data.type` or `data.id` that contradicts the endpoint, or a genuine unique-constraint
        violation. **Not** a replayed `POST`: a replay derives the same title, therefore the same
        slug, which the slug deriver suffixes to `-2`, producing a `201` and a second row.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            documentMismatch:
              summary: The document disagrees with the endpoint
              value:
                errors:
                  - status: '409'
                    code: conflict
                    title: Conflict
                    detail: 'The document type "projects" does not match the endpoint type "writings".'
                    source:
                      pointer: /data/type
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2
            uniqueConstraint:
              summary: A unique constraint violation
              value:
                errors:
                  - status: '409'
                    code: conflict
                    title: Conflict
                    detail: 'The request conflicts with a unique constraint on the resource.'
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    UnsupportedMediaType:
      description: |
        A write whose `Content-Type` is not `application/vnd.api+json`, or a JSON:API media type
        carrying a parameter other than `ext`/`profile`. A **missing** `Content-Type` on a write is
        this `415` too — without it the body has no declared interpretation. The response carries
        `Accept: application/vnd.api+json`.
      headers:
        Accept: { $ref: '#/components/headers/Accept' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            unsupportedMediaType:
              summary: The §4.6 example — note source.header, which §4.6's member list omits
              value:
                errors:
                  - status: '415'
                    code: unsupported_media_type
                    title: Unsupported media type
                    detail: Request content type must be application/vnd.api+json.
                    source:
                      header: Content-Type
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    SearchUnsupportedMediaType:
      description: |
        A `QUERY` whose `Content-Type` is present but is not `application/json`. The response
        advertises both the media type it wants (`Accept`) and QUERY support (`Accept-Query`), so
        the caller can retry without a discovery round trip.

        A **missing** `Content-Type` on a `QUERY` is a `400`, not this status: §4.1's table
        separates "missing" from "unsupported", and the coordinator's pinned decision 13 scopes
        that `400` to `QUERY`. On a **write**, a missing `Content-Type` is the `415` above — the
        body has no declared interpretation and JSON:API is the only one the endpoint accepts.
      headers:
        Accept: { $ref: '#/components/headers/Accept' }
        Accept-Query: { $ref: '#/components/headers/AcceptQuery' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            unsupportedMediaType:
              value:
                errors:
                  - status: '415'
                    code: unsupported_media_type
                    title: Unsupported media type
                    detail: Request content type must be application/json.
                    source:
                      header: Content-Type
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    ValidationFailed:
      description: |
        A validation failure, or a member the resource does not accept on a write. One error object
        per failed rule; each carries the offending member as an RFC 6901 pointer in
        `source.pointer` (`/data/attributes/title`) or, for a query parameter, as
        `source.parameter` (`page[size]`). A `PUT` that omits `title` is this status, not a silent
        reset: `title` is NOT NULL with no database default.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            requiredTitle:
              summary: The §4.6 example
              value:
                errors:
                  - status: '422'
                    code: validation_failed
                    title: Validation failed
                    detail: The title field is required.
                    source:
                      pointer: /data/attributes/title
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2
            nonWritableMember:
              summary: A member that is not writable — slug is derived server-side
              value:
                errors:
                  - status: '422'
                    code: validation_failed
                    title: Validation failed
                    detail: The slug attribute is not writable.
                    source:
                      pointer: /data/attributes/slug
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2
            unknownTag:
              summary: An unknown tag id in relationships.tags.data
              value:
                errors:
                  - status: '422'
                    code: validation_failed
                    title: Validation failed
                    detail: The selected data.relationships.tags.data.0.id is invalid.
                    source:
                      pointer: /data/relationships/tags/data/0/id
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    SearchValidationFailed:
      description: |
        Unprocessable query content — something only a request body can express: a `q` outside the
        2–100 character range, a `types` that is not an array of strings, a `page` that is not an
        object, a non-integer `page.number`/`page.size`. The pointer is into the request document
        (`/q`, `/types/0`, `/page/size`), not a query parameter. Table B gives
        `GET /api/v1/search` no `422` at all.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            shortQuery:
              value:
                errors:
                  - status: '422'
                    code: validation_failed
                    title: Validation failed
                    detail: q must be at least 2 characters.
                    source:
                      pointer: /q
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2
            wrongType:
              summary: types is not an array of strings
              value:
                errors:
                  - status: '422'
                    code: validation_failed
                    title: Validation failed
                    detail: types must be an array of strings.
                    source:
                      pointer: /types
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    RateLimited:
      description: |
        The limiter for this route rejected the request. The body is the JSON:API envelope produced
        by the limiter's own `Limit::response()`, so the shape cannot drift from every other error,
        and `Retry-After` is quoted in `detail` as well as sent as a header.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            rateLimited:
              value:
                errors:
                  - status: '429'
                    code: rate_limited
                    title: Too many requests
                    detail: Rate limit exceeded. Retry after 30 seconds.
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    ServerError:
      description: An unhandled server error. No internals are leaked — only the envelope and `meta.request_id`, which is the value to quote when reporting it.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/JsonApiErrorDocument' }
          examples:
            serverError:
              value:
                errors:
                  - status: '500'
                    code: server_error
                    title: Server error
                    detail: An unexpected error occurred.
                    meta:
                      request_id: 01J8Z0K3M4N5P6Q7R8S9T0V1W2

    CollectionOptions:
      description: '`200`, empty body, with `Allow: GET, HEAD, OPTIONS, POST`. Public and unthrottled, so no `X-RateLimit-*` headers. Discovery only — it advertises nothing else, because level 2 has no API root document.'
      headers:
        Allow: { $ref: '#/components/headers/Allow' }

    ItemOptions:
      description: '`200`, empty body, with `Allow: GET, HEAD, OPTIONS, PUT, PATCH, DELETE`. Public and unthrottled.'
      headers:
        Allow: { $ref: '#/components/headers/Allow' }

    SearchOptions:
      description: '`200`, empty body, with `Allow: GET, HEAD, OPTIONS, QUERY` and `Accept-Query: application/json`. This is how a client discovers that the URI takes a `QUERY` and what body media type it must declare.'
      headers:
        Allow: { $ref: '#/components/headers/Allow' }
        Accept-Query: { $ref: '#/components/headers/AcceptQuery' }

    SearchOk:
      description: |
        The search document, served as `application/json` — deliberately not JSON:API, because the
        primary data mixes resource types. Each hit carries `path`, the canonical public route for
        that item. No `Vary: Accept`: the media type is fixed by contract. No `Content-Location`
        or `Location`: v1 mints no result URIs.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        ETag: { $ref: '#/components/headers/ETag' }
        Accept-Query: { $ref: '#/components/headers/AcceptQuery' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SearchDocument' }
          examples:
            query:
              summary: The §4.4.3 document, from QUERY
              value:
                results:
                  - type: writings
                    id: '42'
                    title: 'Placeholder: building a portfolio API'
                    excerpt: Placeholder seed content — not a real claim.
                    path: /writing/placeholder-building-a-portfolio-api
                    score: 1.0
                  - type: projects
                    id: '8'
                    title: Placeholder project
                    excerpt: Placeholder seed content — not a real claim.
                    path: /projects
                    score: 0.72
                meta:
                  page: { number: 1, size: 20, total: 2, pages: 1 }
                  counts_by_type: { writings: 1, projects: 1 }
            get:
              summary: The same document from the GET fallback, with no matches
              value:
                results: []
                meta:
                  page: { number: 1, size: 20, total: 0, pages: 1 }
                  counts_by_type: {}

    WorkExperienceCollection:
      description: One page of published work experiences as a JSON:API document. For `HEAD`, the same status and headers with no body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        ETag: { $ref: '#/components/headers/ETag' }
        Last-Modified: { $ref: '#/components/headers/LastModified' }
        Vary: { $ref: '#/components/headers/Vary' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/WorkExperienceCollectionDocument' }

    WorkExperienceItem:
      description: One published work experience as a JSON:API document, with `links.self` and `meta.updated_at`. For `HEAD`, the same status and headers with no body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        ETag: { $ref: '#/components/headers/ETag' }
        Last-Modified: { $ref: '#/components/headers/LastModified' }
        Vary: { $ref: '#/components/headers/Vary' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/WorkExperienceDocument' }

    WorkExperienceCreated:
      description: The new work experience as a JSON:API document. `Location` and `data.links.self` are the same URL.
      headers:
        Location: { $ref: '#/components/headers/Location' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/WorkExperienceDocument' }

    WorkExperienceUpdated:
      description: The resulting work experience as a JSON:API document, returned so the client needs no second request. Writes are `no-store`, so there is no new `ETag` to read from this response.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/WorkExperienceDocument' }

    EducationCollection:
      description: One page of published education records as a JSON:API document. For `HEAD`, the same status and headers with no body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        ETag: { $ref: '#/components/headers/ETag' }
        Last-Modified: { $ref: '#/components/headers/LastModified' }
        Vary: { $ref: '#/components/headers/Vary' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/EducationCollectionDocument' }

    EducationItem:
      description: One published education record as a JSON:API document, with `links.self` and `meta.updated_at`. For `HEAD`, the same status and headers with no body.
      headers:
