    PublicationUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type]
          properties:
            type:
              type: string
              const: publications
            id:
              type: string
              description: When supplied, must equal the id in the path, else `409`.
            attributes: { $ref: '#/components/schemas/PublicationWritableAttributes' }
            relationships: { $ref: '#/components/schemas/RelationshipsWrite' }

    # ------------------------------------------------------------------ projects

    ProjectAttributes:
      allOf:
        - $ref: '#/components/schemas/ContentAttributes'
        - type: object
          properties:
            repo_url:
              type: [string, 'null']
