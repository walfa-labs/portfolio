openapi: 3.1.0

info:
  title: Portfolio API — v1
  version: 1.0.0
  summary: The public read API and the session-authenticated write API for the portfolio's eight content resources.
  description: |
    # Portfolio API v1

    Richardson Maturity Model **level 2**: real verbs on real resource URIs, real status codes,
    no hypermedia controls. Every `links` member the API emits is a URL it actually serves — the
    resource object's `self` and the collection's pagination links; no relationship URL is
    advertised, because no relationship endpoint exists.

    This document is the **contract of record**. It is hand-written (the PRD rejects generating
    it, because a generator that misdescribes the `QUERY` method or the JSON:API resource shapes
    would produce a spec worse than none) and it is pinned to reality by a contract test that
    compares `php artisan route:list --json` — vendor routes excluded — against this document's
    `paths` × methods, failing on drift in either direction.

    ## Base URL

    Every path below is absolute and already carries the `/api/v1` prefix, so the full URL of a
    request is `<server>` + `<path>`. `bootstrap/app.php` keeps Laravel's default `apiPrefix`
    (`api`), and v1 lives in one file, `routes/api.php`, inside a `Route::prefix('v1')` group.
    There is **no API root document**: `GET /api/v1` is a `404`, because level 2 has nothing to
    advertise.

    ## The closed resource set

    Eight resources, no ninth. Path segments are plural kebab-case; the JSON:API `type` is the
    snake_case plural; the single-resource routes bind the numeric `id` — slugs are attributes,
    never API path parameters.

    | `type` | Collection URI | Single URI |
    | --- | --- | --- |
    | `work_experiences` | `/api/v1/work-experiences` | `/api/v1/work-experiences/{work_experience}` |
    | `educations` | `/api/v1/educations` | `/api/v1/educations/{education}` |
    | `certifications` | `/api/v1/certifications` | `/api/v1/certifications/{certification}` |
    | `publications` | `/api/v1/publications` | `/api/v1/publications/{publication}` |
    | `projects` | `/api/v1/projects` | `/api/v1/projects/{project}` |
    | `awards` | `/api/v1/awards` | `/api/v1/awards/{award}` |
    | `writings` | `/api/v1/writings` | `/api/v1/writings/{writing}` |
    | `tags` | `/api/v1/tags` | `/api/v1/tags/{tag}` |

    `tags` is a full six-method resource with no exceptions. Nesting is **none**: tag-scoped
    listings are `GET /api/v1/writings?filter[tag]=laravel`, never `/api/v1/tags/laravel/writings`.
    JSON:API relationship URLs are out of scope in v1 — reads use `include=tags`, writes set
    `relationships.tags.data`.

    ## Media types

    | Situation | Media type |
    | --- | --- |
    | JSON:API success responses (every resource read and write) | `application/vnd.api+json` |
    | `GET`/`QUERY /api/v1/search` success | `application/json` |
    | Every error, on every endpoint, including `/search` | `application/vnd.api+json` |
    | Write request bodies | `application/vnd.api+json` |
    | `QUERY /api/v1/search` request bodies | `application/json` |

    The search endpoint's asymmetry is **intended**: its primary data mixes resource types, so the
    search document is deliberately not JSON:API. `Vary: Accept` therefore applies to JSON:API
    responses only.

    `Accept` on a resource endpoint may name `application/vnd.api+json` or `application/json` —
    they select the same document, and refusing the obvious one would `406` every naive client.
    An `Accept` that names neither is a `406` whose response carries `Accept` listing what the
    endpoint can produce. `/api/v1/search` accepts `application/json` and
    `application/vnd.api+json`, and its `406` lists both.

    ## The verb matrix

    Identical for all eight resources — no per-resource verbs.

    | Method | URI shape | Auth | Success | Error statuses |
    | --- | --- | --- | --- | --- |
    | `GET` | collection | public | `200` + collection document | `400`, `406`, `429`, `500` |
    | `GET` | single | public | `200` + single document | `400`, `404`, `406`, `429`, `500` |
    | `POST` | collection | session + admin | `201` + `Location` + resource document | `400`, `401`, `403`, `409`, `415`, `422`, `429`, `500` |
    | `PUT` | single | session + admin | `200` + resource document (full replacement) | `400`, `401`, `403`, `404`, `409`, `415`, `422`, `429`, `500` |
    | `PATCH` | single | session + admin | `200` + resource document (partial) | `400`, `401`, `403`, `404`, `409`, `415`, `422`, `429`, `500` |
    | `DELETE` | single | session + admin | `204`, empty body | `401`, `403`, `404`, `429`, `500` |
    | `OPTIONS` | collection and single | public | `200` + `Allow`, empty body | — |
    | `HEAD` | collection and single | public | `200`, no body, same headers as `GET` | as `GET` |
    | anything else | collection and single | — | — | `405` + `Allow` |

    `Allow` is per **URI shape**, not one value for the whole API:

    | URI shape | `Allow` |
    | --- | --- |
    | collection | `GET, HEAD, OPTIONS, POST` |
    | single | `GET, HEAD, OPTIONS, PUT, PATCH, DELETE` |
    | `/api/v1/search` | `GET, HEAD, OPTIONS, QUERY` |

    `DELETE` on a collection is a `405`. `201` on `POST` carries `Location`; JSON:API requires that
    URL and the resource object's own `links.self` to be one and the same, so both are built from
    one named route. `PUT`/`PATCH` answer `200` with the resulting representation so the client gets
    the new `ETag` in the same round trip. `204` on `DELETE`; a second `DELETE` of the same id is a
    `404` while the *effect* of the verb stays idempotent.

    ## `QUERY` — the API's only non-GET read

    `QUERY /api/v1/search` follows RFC 10008, *The HTTP QUERY Method*. It is safe and idempotent.
    The request body is `application/json` and carries the query; a `Content-Type` that is not
    `application/json` is a `415` whose response advertises both the media type it wants (`Accept`)
    and QUERY support (`Accept-Query`). Missing `Content-Type` on a `QUERY` is the same `415`;
    missing `Content-Type` on a **write** is a `415` too.

    A client discovers support from `Accept-Query: application/json`, which rides on the `GET`,
    `HEAD` and `OPTIONS` responses of `/api/v1/search`. `OPTIONS` also carries `Allow`.

    **Fallback.** `GET /api/v1/search` accepts the same fields flattened into query parameters and
    returns the **identical** document — there is no method marker in the payload, because `QUERY`
    and `GET` are two input channels for one canonical search and RFC 10008 defines the `QUERY`
    response's selected representation as the equivalent `GET` resource's. There is
    **no `POST /api/v1/search`** — an unsafe fallback would teach clients the wrong verb.

    **Runtime note.** `php artisan serve` cannot serve `QUERY` (it answers `501`); the dev server,
    browser checks and edge verification must run against the FrankenPHP compose service. Laravel
    feature tests are unaffected: `$this->queryJson(...)` builds a Symfony request directly and
    never touches a SAPI.

    **Spec note.** OpenAPI 3.1's Path Item Object has no `query` fixed field — its method set
    predates RFC 10008 — so `query` is written here as a method key anyway, because a contract of
    record that hid the API's only non-GET read behind an `x-` extension would be lying by
    omission. Redocly's `struct` rule flags that one key and nothing else; `redocly lint
    --skip-rule struct docs/api/openapi.yaml` is clean.

    **Note for the contract test.** A path item here carries `summary`, `description` and — on the
    single-resource paths — `parameters` beside its method keys, all of which OpenAPI 3.1 permits.
    Collect methods by intersecting a path item's keys with
    `get, head, options, query, post, put, patch, delete`, not by taking `array_keys()` of the whole
    path item. Path template parameter names match `route:list` character for character
    (`{work_experience}`, not `{id}`), and `HEAD` is declared explicitly because Laravel's own
    `route:list` reports it as `GET|HEAD` on the same entry.

    ## Errors

    Every error response — including `429` and `500` — is a JSON:API document with
    `Content-Type: application/vnd.api+json`, a top-level `errors` array, and never `data`
    alongside it. Errors are `Cache-Control: no-store` and `Vary: Accept`.

    Members used: `status` (string), `code` (stable machine string), `title`, `detail`,
    `source.pointer` (RFC 6901 pointer into the request document), `source.parameter` (query
    parameter), `source.header` (request header), `links`, and `meta.request_id` on every object.

    | Status | Triggered by | `code` |
    | --- | --- | --- |
    | `400` | unrecognised/undeclared `filter[…]`, `sort`, `include`, `fields[…]`, or an unknown query parameter; `page.size` outside 1–100; malformed JSON body; a missing `Content-Type` on a `QUERY` | `invalid_query_parameter`, `malformed_body` |
    | `401` | unauthenticated write (no session) | `unauthenticated` |
    | `403` | authenticated but not the administrator, or a policy denial | `forbidden` |
    | `404` | unknown id; unknown collection; second `DELETE` | `not_found` |
    | `405` | verb not in the matrix (e.g. `QUERY` on a collection) | `method_not_allowed` |
    | `406` | `Accept` cannot be satisfied | `not_acceptable` |
    | `409` | `data.type`/`data.id` mismatch on `PUT`/`PATCH`, or a genuine unique-constraint violation | `conflict` |
    | `415` | write `Content-Type` is not `application/vnd.api+json`; search `Content-Type` is not `application/json`; the JSON:API media type carries a parameter other than `ext`/`profile`; a missing `Content-Type` on a write | `unsupported_media_type` |
    | `422` | validation failure; a non-writable member supplied | `validation_failed` |
    | `429` | rate limit exceeded | `rate_limited` |
    | `500` | unhandled server error, no internals leaked | `server_error` |

    The `405` and `406` bodies are authored here: the PRD's §4.6 omits both, and its member list
    omits `source.header` even though its own `415` example uses it. `405` carries `Allow`;
    `406` and `415` carry `Accept` naming what the endpoint can produce.

    **There is no `409`-on-replay.** A replayed `POST` derives the same title and therefore the
    same slug, which the server-side slug deriver suffixes to `-2`, producing a `201` and a second
    row. `409` is reserved for a `data.type`/`data.id` mismatch and for a genuine unique-constraint
    violation outside the slug. v1 has no `Idempotency-Key` support.

    ## Pagination

    `page[number]` is 1-based and defaults to `1`; `page[size]` defaults to `20` and is accepted in
    the range **1–100**. A `page[size]` outside that range is a `400` — never silently clamped. An
    out-of-range `page[number]` is a `200` with `data: []`, not a `404`.

    Collection documents carry `meta.page.{number,size,total,pages}` and `links.{self,first,prev,
    next,last}`, each link preserving the caller's other query parameters. Cursor pagination
    (`page[cursor]`) is out of v1.

    ## Filtering, sorting, includes and sparse fieldsets

    Parsing and allow-list enforcement come from `spatie/laravel-query-builder`. An undeclared
    filter, sort, include or field name is **rejected with `400`**, never ignored, and the `400`
    detail lists the allowed names. Operator filters (`filter[published_at]=>=2026-01-01`) accept a
    **single** value only; comma-separated lists are for the exact and tag filters, where they mean
    OR.

    The allow-list per resource — the enumeration of record:

    | Resource | `filter[…]` | `sort` | `include` | default sort |
    | --- | --- | --- | --- | --- |
    | `work-experiences` | `tag`, `tags`, `tags_all`, `q` | `end_date`, `title` | `tags` | `-end_date` |
    | `educations` | `tag`, `tags`, `tags_all`, `q` | `end_date`, `title` | `tags` | `-end_date` |
    | `certifications` | `tag`, `tags`, `tags_all`, `q`, `expired` | `issued_on`, `title` | `tags` | `-issued_on` |
    | `publications` | `tag`, `tags`, `tags_all`, `q` | `issued_on`, `title` | `tags` | `-issued_on` |
    | `projects` | `tag`, `tags`, `tags_all`, `q`, `featured` | `started_on`, `title` | `tags` | `-started_on` |
    | `awards` | `tag`, `tags`, `tags_all`, `q` | `awarded_at`, `title` | `tags` | `-awarded_at` |
    | `writings` | `tag`, `tags`, `tags_all`, `q`, `series` | `published_at`, `title`, `updated_at` | `tags` | `-published_at` |
    | `tags` | `tag`, `tags`, `q` | `name` | `tags` | `name` |

    Every sortable field accepts the `-` prefix for descending, and `sort` accepts a
    comma-separated multi-sort (`sort=-published_at,title`). `filter[tag]` and its alias
    `filter[tags]` match **any** of the comma-separated tag slugs; `filter[tags_all]` narrows to
    records carrying **every** named tag. `filter[q]` is a partial match over the resource's text
    columns. `filter[featured]` and `filter[expired]` take a boolean (`1`, `0`, `true`, `false`).
    `filter[series]` takes series ids or slugs. `tags` has no relationships, so it declares no
    `include`.

    `fields[<type>]=a,b,c` is the sparse fieldset: `id` and `type` are always present, and an
    unknown `fields[unknown-type]` or unknown field name is a `400` with `source.parameter`.
    `include=tags` is the only embeddable relationship in v1 and is declared on the seven content
    resources. The `tags` resource declares **no** relationship — tags are shared through the
    polymorphic pivot, so a tag has nothing to embed — and therefore declares no `include` either:
    `include=tags` on `/api/v1/tags` is a `400`, not a silently empty `included`.
    `series` is an **attribute object** on `writings`, not a relationship, so `include=series` is a
    `400` exactly like any other undeclared include. The same allow-list is enforced on the
    collection and single-resource paths alike.

    **Drafts are never exposed.** Every public read is `published()`-scoped inside the controller,
    and the scope is not overridable by any query parameter. There is no authenticated read path in
    v1, so the PRD's "authenticated reads" caching row is vacuous here.

    ## Caching and conditional requests

    | Response class | `Cache-Control` | Validators |
    | --- | --- | --- |
    | public `GET`/`HEAD` (collection, single) | `public, max-age=60, stale-while-revalidate=30` | strong `ETag` (hash of the serialised representation **plus the caller's query parameters**), `Last-Modified` = newest `updated_at` in the payload |
    | `QUERY` and `GET /api/v1/search` | `private, max-age=0, must-revalidate` | strong `ETag` |
    | all writes, all errors | `no-store` | none |

    `Vary: Accept` on every JSON:API response. `If-None-Match` / `If-Modified-Since` are honoured on
    the public reads and answer `304` with the same validators and no body. `Last-Modified` has
    one-second granularity, so `ETag` is the authoritative validator; both are emitted when
    derivable. There are **no `If-Match` preconditions and no `Deprecation`/`Sunset` headers in v1**:
    nothing is deprecated, and the deprecation contract is documented as future work only.

    ## Rate limits

    Every tier is attached explicitly — Laravel 13's `api` middleware group applies no throttle by
    default. Responses carry `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`;
    a `429` additionally carries `Retry-After`, and its body is the JSON:API envelope.

    | Limiter | Applies to | Limit | Key |
    | --- | --- | --- | --- |
    | `api-public-read` | `GET`/`HEAD` on collections and singles | 120/min | client IP |
    | `api-search` | `QUERY` and `GET /api/v1/search` | 30/min | client IP |
    | `api-admin-write` | `POST`/`PUT`/`PATCH`/`DELETE` | 60/min | admin user id |

    `OPTIONS` is unthrottled and carries no `X-RateLimit-*` headers.

    ## Authentication and CSRF

    Writes use **session cookies** (Laravel's `web` guard, via Fortify), not API tokens. The only
    writer is one human driving the Inertia admin UI on the same origin as the API. Writes
    therefore need the session cookie *and* the `X-XSRF-TOKEN` header carrying the `XSRF-TOKEN`
    cookie's value. Authorisation lives in the form requests and the model policies, so an absent
    session is a `401` and a denial is a `403` — the two stay meaningful.

    Reads are public and require no credentials. CORS exposes `ETag`, `Last-Modified`, `Location`,
    `Accept-Query`, `X-RateLimit-*` and `Retry-After`; `QUERY` is not CORS-safelisted, so a
    cross-origin `QUERY` always preflights.

    ## Writable attributes

    Shared and writable on every resource: `title`, `summary`, `body`, `status`, `published_at`,
    `meta_title`, `meta_description`, `sort_order`, `is_placeholder` — plus the per-type extras each
    request schema declares. Never writable: `id`, `slug`, `created_at`, `updated_at`, `deleted_at`.
    Derived and therefore not writable on `writings`: `body_html`, `reading_time_minutes`.

    `slug` is derived server-side from `title` on create and is stable on update; supplying it is a
    `422` with `source.pointer: /data/attributes/slug`. `title` is required on `POST` and on `PUT`;
    a `PUT` that omits a NOT NULL column with no database default is a `422`, not a silent reset.
    Any other member the resource does not accept on a write is a `422` naming it in
    `source.pointer`. Tags are never created implicitly by a content write, and an unknown tag id in
    `relationships.tags.data` is a `422` pointing at `/data/relationships/tags/data/<index>/id`.
