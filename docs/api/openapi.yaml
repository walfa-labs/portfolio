      description: |
        The writable attributes of a tag. A tag has no `title`, `status`, `published_at` or
        `summary`, so supplying one is a `422` naming it in `source.pointer`.
      properties:
        name:
          type: string
          maxLength: 60
          description: Required on `POST` and `PUT`. The slug is derived from it.
