    # -------------------------------------------------------------------- search

    SearchQuery:
      type: object
      description: |
        The `QUERY` request body. Every member is optional — an empty object is a valid, empty
        query. An undeclared member is a `400`. This object is *not* a JSON:API document: the search
        endpoint's request and success bodies are plain JSON.
      additionalProperties: false
      properties:
        q:
          type: string
          minLength: 2
          maxLength: 100
          description: The needle. Fewer than 2 or more than 100 characters is a `422`; a query string may instead shorten or truncate, because `GET` has no `422`.
        types:
          type: array
          description: 'Resource types to search. An unknown value is a `400`. Omitted means every type.'
          items:
            type: string
            enum:
              - work-experiences
              - work_experience
              - educations
              - education
              - certifications
              - certification
              - publications
              - publication
              - projects
              - project
              - awards
              - award
              - writings
              - writing
        tags:
          type: array
          description: Tag slugs; a hit must carry at least one of them.
          items:
            type: string
        sort:
          type: string
          description: 'Allowed: `published_at`, `title`, `updated_at`, each optionally `-` prefixed. Anything else is a `400`. Omitted keeps the relevance order.'
        page:
          type: object
          additionalProperties: false
          properties:
            number:
              type: integer
              minimum: 1
              default: 1
              description: An out-of-range number is not an error; it yields an empty result set.
            size:
              type: integer
              minimum: 1
              maximum: 100
              default: 20
              description: Outside 1–100 is a `400`, never a clamp.

    SearchDocument:
      type: object
      description: |
        The search success document. Plain `application/json`, deliberately not JSON:API, because
        the primary data mixes resource types. This shape is authoritative over the earlier
        `{data, meta}` sketch.
      required: [results, meta]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        meta: { $ref: '#/components/schemas/SearchMeta' }

    SearchResult:
      type: object
      description: One hit. `type` is the plural kebab-case resource segment the rest of the API speaks, and `path` is the canonical public route for the item.
      required: [type, id, title, excerpt, path, score]
      properties:
        type:
          type: string
          enum:
            - work-experiences
            - educations
            - certifications
            - publications
            - projects
            - awards
            - writings
        id:
          type: string
        title:
          type: string
        excerpt:
          type: string
          description: The record's excerpt, or a summary-derived stand-in. Empty when neither exists.
        path:
          type: string
          description: 'The canonical public route, for example `/writing/placeholder-building-a-portfolio-api` or `/projects`.'
        score:
          type: number
          format: double
          minimum: 0

    SearchMeta:
      type: object
      required: [page, counts_by_type]
      properties:
        page: { $ref: '#/components/schemas/PaginationPage' }
        counts_by_type:
          type: object
          description: |
            Hit counts per resource type over the **whole** result set, not just the current page —
            a client renders facet links from it. Serialised as `{}` when nothing matched, never as
            `[]`.
          additionalProperties:
            type: integer
            minimum: 0
