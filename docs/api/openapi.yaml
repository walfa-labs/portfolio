      description: |
        One page of published writings as a JSON:API document — the §4.4.1 shape. Every `links`
        member preserves the caller's own query parameters, as JSON:API requires. For `HEAD`, the
        same status and headers with no body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        ETag: { $ref: '#/components/headers/ETag' }
        Last-Modified: { $ref: '#/components/headers/LastModified' }
        Vary: { $ref: '#/components/headers/Vary' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/vnd.api+json:
          schema: { $ref: '#/components/schemas/WritingCollectionDocument' }
          examples:
            page:
              summary: 'The §4.4.1 worked example: page 2 of a filtered, sparse-fieldset collection with tags included. §4.4.1 prints the `links` query with raw brackets; `Arr::query()` percent-encodes them, so this example shows what the server actually emits.'
              value:
                data:
                  - type: writings
                    id: '42'
                    attributes:
                      title: 'Placeholder: building a portfolio API'
                      slug: placeholder-building-a-portfolio-api
                      published_at: '2026-03-02T09:00:00Z'
                    relationships:
                      tags:
                        data:
                          - type: tags
                            id: '7'
                    links:
                      self: https://portfolio.test/api/v1/writings/42
                  - type: writings
                    id: '41'
                    attributes:
                      title: 'Placeholder: another post'
                      slug: placeholder-another-post
                      published_at: '2026-02-11T09:00:00Z'
                    relationships:
                      tags:
                        data: []
                    links:
                      self: https://portfolio.test/api/v1/writings/41
                included:
                  - type: tags
                    id: '7'
                    attributes:
                      name: Laravel
                      slug: laravel
                links:
                  self: 'https://portfolio.test/api/v1/writings?sort=-published_at&filter%5Btags%5D=laravel&include=tags&fields%5Bwritings%5D=title%2Cslug%2Cpublished_at&page%5Bnumber%5D=2&page%5Bsize%5D=2'
                  first: 'https://portfolio.test/api/v1/writings?sort=-published_at&filter%5Btags%5D=laravel&include=tags&fields%5Bwritings%5D=title%2Cslug%2Cpublished_at&page%5Bnumber%5D=1&page%5Bsize%5D=2'
                  prev: 'https://portfolio.test/api/v1/writings?sort=-published_at&filter%5Btags%5D=laravel&include=tags&fields%5Bwritings%5D=title%2Cslug%2Cpublished_at&page%5Bnumber%5D=1&page%5Bsize%5D=2'
                  next: 'https://portfolio.test/api/v1/writings?sort=-published_at&filter%5Btags%5D=laravel&include=tags&fields%5Bwritings%5D=title%2Cslug%2Cpublished_at&page%5Bnumber%5D=3&page%5Bsize%5D=2'
                  last: 'https://portfolio.test/api/v1/writings?sort=-published_at&filter%5Btags%5D=laravel&include=tags&fields%5Bwritings%5D=title%2Cslug%2Cpublished_at&page%5Bnumber%5D=5&page%5Bsize%5D=2'
                meta:
                  page: { number: 2, size: 2, total: 9, pages: 5 }

